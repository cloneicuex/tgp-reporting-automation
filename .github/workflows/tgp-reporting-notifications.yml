name: TGP reporting notifications

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "17 * * * *"
  push:
    paths:
      - .github/workflows/tgp-reporting-notifications.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  id-token: write

concurrency:
  group: tgp-reporting-notifications
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTIFICATION_ENDPOINT: https://tgp-ministry-reporting.oviaesud.chatgpt.site/api/notifications/scheduled
      OIDC_AUDIENCE: tgp-reporting-notifications
    steps:
      - name: Request scheduler identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
          token="$(jq -er '.value' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run application notifications
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 -c 'import os,json,base64; p=os.environ["OIDC_TOKEN"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ["repository","ref","workflow_ref","event_name"]}))'
          endpoint="$NOTIFICATION_ENDPOINT"
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_MODE" == "dry-run" ) ]]; then
            endpoint="$endpoint?dry=1"
          fi
          response="$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Accept: application/json" "$endpoint")"
          jq . <<< "$response"
          jq -e '.ok == true and (.failed // 0) == 0' <<< "$response" >/dev/null
